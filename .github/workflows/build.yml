name: Build and check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug lintRelease
      - run: python3 scripts/audit-artifacts.py build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ci-debug-not-for-release
          path: |
            build/outputs/apk/debug/*.apk
            build/reports/lint-results-release.html
