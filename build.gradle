plugins { id 'com.android.application' version '8.13.2' }
android {
 namespace 'com.temery.hunterscompanion'
 compileSdk 36
 defaultConfig { applicationId 'com.temery.hunterscompanion'; minSdk 29; targetSdk 36; versionCode 3; versionName '0.3.0' }
 sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 signingConfigs {
  release {
   if (System.getenv('SIGNING_KEYSTORE')) {
    storeFile file(System.getenv('SIGNING_KEYSTORE'))
    storePassword System.getenv('SIGNING_STORE_PASSWORD')
    keyAlias System.getenv('SIGNING_KEY_ALIAS')
    keyPassword System.getenv('SIGNING_KEY_PASSWORD')
   }
  }
 }
 buildTypes { release { if (System.getenv('SIGNING_KEYSTORE')) signingConfig signingConfigs.release } }
}
